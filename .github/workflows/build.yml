name: Build and release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # yt-dlp[default] pulls in yt-dlp-ejs (YouTube's challenge solver) plus
      # requests/websockets/etc. This frozen copy is only the fallback: the
      # app downloads a newer yt-dlp at runtime (ytdlp_engine.py).
      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Freeze backend to ytdlp-backend.exe
        run: pyinstaller --onefile --name ytdlp-backend --distpath dist backend_ipc.py

      # A release branch, not master: master builds target the newest NVENC API
      # and need NVIDIA driver 610+, so GPU encoding silently fails on older
      # drivers. 8.1 works on 595. Bump deliberately, after testing NVENC.
      - name: Download bundled ffmpeg
        shell: bash
        run: |
          mkdir -p vendor/ffmpeg
          curl -sL -o ffmpeg.zip "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n8.1-latest-win64-gpl-8.1.zip"
          unzip -q ffmpeg.zip -d ffmpeg-extract
          DIR=$(find ffmpeg-extract -mindepth 1 -maxdepth 1 -type d -name "ffmpeg-*" | head -n 1)
          echo "Extracted to: $DIR"
          if [ -z "$DIR" ]; then
            echo "No ffmpeg-* directory found in ffmpeg-extract:" && ls -la ffmpeg-extract
            exit 1
          fi
          cp "$DIR/bin/ffmpeg.exe" vendor/ffmpeg/ffmpeg.exe
          cp "$DIR/bin/ffprobe.exe" vendor/ffmpeg/ffprobe.exe
          rm -rf ffmpeg.zip ffmpeg-extract

      # Vite 8 needs Node 20.19+ / 22.12+.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Electron dependencies
        working-directory: electron
        run: npm ci

      # `pack` = vite build (the React/Fluent renderer) + electron-builder with
      # --publish never; the release upload is the step below.
      - name: Build Windows installer + portable exe
        working-directory: electron
        run: npm run pack

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-electron/*.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
